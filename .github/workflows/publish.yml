name: media-downloader-ez

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Requis pour générer le jeton OIDC éphémère

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - run: npm ci # Préférable à 'npm install' en CI (plus rapide et déterministe)

      - run: npm publish --provenance --access public